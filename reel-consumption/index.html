<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel Consumption</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12806a">
<link rel="icon" type="image/png" sizes="192x192" href="rc-icon-192.png">
<link rel="apple-touch-icon" href="rc-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reel Entry">
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){});</script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--bg:#0f1720;--card:#18232f;--line:#2b3a4a;--text:#e8eef5;--mut:#93a4b6;
        --acc:#19b394;--warn:#f0a030;--bad:#e5534b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
  header{background:#12806a;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;flex:1}
  header input{width:150px}
  main{padding:12px 16px;max-width:760px;margin:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:12px;background:#0c131b;color:var(--text)}
  input{width:100%}
  button{background:var(--acc);border:none;color:#04241d;font-weight:700;cursor:pointer;white-space:nowrap}
  button.sec{background:#2b3a4a;color:var(--text);font-weight:500}
  button.del{background:transparent;color:var(--bad);padding:6px 10px}
  button:disabled{opacity:.5}
  .job{display:flex;justify-content:space-between;gap:8px;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  .job:hover{background:#1f2d3b}
  .mut{color:var(--mut);font-size:14px}
  .pill{display:inline-block;white-space:nowrap;padding:3px 9px;border-radius:99px;font-size:13px;background:#2b3a4a}
  .pill.ok{background:#1d4d2b;color:#9be9a8}.pill.warn{background:#5a3d0a;color:#ffd58a}.pill.bad{background:#5a1d1d;color:#ffb3ad}
  .row{display:flex;gap:8px;align-items:center}
  .slot{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .slot.active{border-color:var(--acc);background:#132b27}
  .slot h3{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
  .num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:#2b3a4a;align-items:center;justify-content:center;margin-right:8px}
  .slot.active .num{background:var(--acc);color:#04241d}
  .reel{background:#0c131b;border-radius:10px;padding:10px;margin-top:8px}
  .find{margin-top:8px;padding:10px;border-radius:10px;background:#0c131b;border:1px dashed var(--line)}
  .steps{display:flex;gap:8px;margin-bottom:12px}
  .steps button{flex:1}
  .steps button.on{background:var(--acc);color:#04241d}
  .scanner{position:fixed;inset:0;background:rgba(4,10,16,.85);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:10px}
  .scanner.show{display:flex}
  .scanner .sheet{width:min(100%,560px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  #qrReader{width:100%;min-height:240px;background:#000;border-radius:10px;overflow:hidden}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  table.rep{width:100%;border-collapse:collapse;font-size:15px}
  table.rep th,table.rep td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
  table.rep th:first-child,table.rep td:first-child{text-align:left}
  table.rep th{color:var(--mut);font-weight:600}
  .srow{padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
  .srow:hover{background:#1f2d3b}
  #msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:12px 18px;border-radius:10px;display:none;max-width:92%;z-index:9}
</style>
</head>
<body>
<header>
  <img src="rc-icon-192.png" alt="" width="32" height="32" style="border-radius:8px">
  <h1>Reel Consumption</h1>
  <button id="installBtn" class="sec" style="display:none" onclick="installApp()">Install app</button>
  <input id="op" placeholder="Operator name" onchange="saveOp()">
</header>
<main>
  <div class="steps" id="topNav">
    <button id="navJobs" class="on" onclick="showTab('jobs')">Jobs</button>
    <button id="navStatus" class="sec" onclick="showTab('status')">Status</button>
    <button id="navReport" class="sec" onclick="showTab('report')">Report</button>
  </div>
  <section id="reportView" style="display:none">
    <div class="card">
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <label class="mut" style="min-width:0">From<input id="rpFrom" type="date" style="min-width:0"></label>
        <label class="mut" style="min-width:0">To<input id="rpTo" type="date" style="min-width:0"></label>
        <label class="mut" style="grid-column:1/-1">Group<select id="rpGroup" style="width:100%;font:inherit;padding:12px;border-radius:10px;background:#0c131b;color:var(--text);border:1px solid var(--line)">
          <option value="day">Date-wise</option><option value="month">Month-wise</option></select></label>
      </div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap">
        <button class="sec" onclick="rpPreset('today')">Today</button>
        <button class="sec" onclick="rpPreset('7')">7 days</button>
        <button class="sec" onclick="rpPreset('month')">This month</button>
        <button class="sec" onclick="rpPreset('year')">This year</button>
        <button style="flex:1" onclick="loadReport()">Show</button>
      </div>
    </div>
    <div id="rpBody"></div>
  </section>
  <section id="statusView" style="display:none">
    <div class="card row" style="justify-content:space-between">
      <span class="mut" id="stInfo">Reel status (last 2 days in ERP + all pending)</span>
      <button class="sec" onclick="loadStatus()">&#8635;</button>
    </div>
    <div id="stBody"><div class="card mut">Tap refresh to load.</div></div>
  </section>
  <section id="listView">
    <div class="card">
      <div class="row">
        <input id="q" oninput="renderJobs()" placeholder="Search job card / WO No (e.g. 0419)">
        <button class="sec" onclick="loadJobs()">&#8635;</button>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="mut" style="flex:1;min-width:0">Planning date
          <input id="pDate" type="date" style="min-width:0" onchange="loadJobs()"></label>
        <button class="sec" style="align-self:flex-end" onclick="$('pDate').value='';loadJobs()">Recent</button>
      </div>
      <div class="mut" id="jobsSum" style="margin-top:8px"></div>
    </div>
    <div class="card" id="jobs"><span class="mut">Loading corrugation job cards...</span></div>
  </section>

  <section id="jobView" style="display:none">
    <div class="card">
      <button class="sec" onclick="back()">&larr; Job list</button>
      <h2 id="jTitle" style="margin:10px 0 4px"></h2>
      <div class="mut" id="jSub"></div>
      <div class="mut" style="margin-top:8px">Wrong ply?
        <button class="sec" onclick="setPly(3)">3 ply</button>
        <button class="sec" onclick="setPly(5)">5 ply</button></div>
    </div>
    <div class="steps">
      <button id="tab1" onclick="setStep(1)">1. Load reel</button>
      <button id="tab2" onclick="setStep(2)">2. Enter weight</button>
    </div>
    <div id="slots"></div>
  </section>
</main>
<div id="msg"></div>
<div id="scanner" class="scanner" aria-hidden="true">
  <div class="sheet">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <b>Scan Reel QR / Barcode</b>
      <button class="sec" onclick="closeScanner()">&times;</button>
    </div>
    <div id="qrReader"></div>
    <div class="mut" id="scanNote" style="margin-top:8px">Point the camera at the reel QR / barcode. Reel No or Mill No is filled and searched automatically.</div>
  </div>
</div>

<script>
var PLY_NAMES={3:["Top","Flute","Bottom"],5:["Top","Flute-1","Middle","Flute-2","Bottom"],
  7:["Top","Flute-1","Liner-1","Flute-2","Liner-2","Flute-3","Bottom"]};
var JOBS=[], job=null, ENTRIES=[], step=1, activePly=0, found=null, busy=false;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(t,kind){var m=$("msg");m.textContent=t;m.style.display="block";
  m.style.background=kind==="bad"?"#7a2420":kind==="ok"?"#1d5a30":"#3a4a5a";
  clearTimeout(m._t);m._t=setTimeout(function(){m.style.display="none"},4500)}
/* ---------- Supabase (same project as Production Data Entry) ---------- */
var SB_URL="https://axgyeppfrcmhwrpxztvv.supabase.co";
var SB_KEY="sb_publishable_fVX7S1YB3Zank8FTUmlpXg_v0nkwLCT";   // publishable key only (same as Production app). Never a secret key.
var JOB_DAYS=4;
async function sb(fn,body){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},25000);
  try{var r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",signal:ctl.signal,
      headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
    var txt=await r.text(),j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
    if(!r.ok)throw Error((j&&(j.message||j.hint))||("Server error "+r.status));return j}
  catch(e){if(e.name==="AbortError")throw Error("Internet is slow, please try again.");
    if(e instanceof TypeError)throw Error("Could not connect to the server. Check internet.");throw e}
  finally{clearTimeout(t)}}
function plyCount(t){var m=String(t||"").match(/(\d)\s*[- ]?\s*ply/i);var n=m?+m[1]:3;return PLY_NAMES[n]?n:3}
function pDate(v){var s=String(v||"").trim(),m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return new Date(+m[1],m[2]-1,+m[3]);
  if(m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/))return new Date(+m[3],m[2]-1,+m[1]);
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return new Date(+m[3],m[1]-1,+m[2]);return null}
function fDate(d){return d?("0"+d.getDate()).slice(-2)+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+d.getFullYear():""}
/* To save Supabase free-tier egress: delta load like the Production app —
   the phone keeps a copy of jobs, the server sends only changed rows (pv3_list_jobs2). */
async function jobRows(again){
  var c=null;try{c=JSON.parse(localStorage.getItem("rc_jobs2")||"null")}catch(e){}
  if(!c||!c.rows||Date.now()-(c.full||0)>24*3600000)c={full:Date.now(),rows:{},hash:null};
  var r;
  try{r=await sb("pv3_list_jobs2",{p_known:Object.keys(c.rows).map(function(k){return k+"@"+c.rows[k].v}),p_hash:c.hash})}
  catch(e){if(/pv3_list_jobs2|schema cache/i.test(e.message))return (await sb("pv3_list_jobs"))||[];throw e}
  (r.rows||[]).forEach(function(x){c.rows[x.row_id]={v:x.revision,data:x.data}});
  var ids=r.ids||[];
  if(ids.length!==r.n||ids.some(function(i){return !c.rows[i]})){
    try{localStorage.removeItem("rc_jobs2")}catch(e){}
    if(!again)return jobRows(true);throw Error("Job list did not load, please refresh.")}
  var keep={};ids.forEach(function(i){keep[i]=c.rows[i]});
  try{localStorage.setItem("rc_jobs2",JSON.stringify({full:c.full,rows:keep,hash:r.hash}))}catch(e){}
  return ids.map(function(i){return {data:keep[i].data}});
}
var API={
  getJobs:async function(day){            // day = "YYYY-MM-DD" (planning date) ya "" (recent JOB_DAYS)
    var rows=await jobRows();var cut=new Date();cut.setHours(0,0,0,0);cut.setDate(cut.getDate()-JOB_DAYS);
    var want=day?fDate(pDate(day)):"";
    var seen={},jobs=[];
    for(var i=rows.length-1;i>=0;i--){var d=rows[i].data||rows[i];
      if(String((d["Machine Name"]||"")+" "+(d["Process Name"]||"")).toUpperCase().indexOf("CORRUGATION")<0)continue;
      var pp=String(d["PP Code"]||"").trim();if(!pp||seen[pp])continue;
      var dt=pDate(d["Production Date"]||d["Date"]);
      if(want){ if(fDate(dt)!==want)continue } else if(dt&&dt<cut)continue;
      seen[pp]=1;
      jobs.push({wo:d["WO No"],pp:pp,customer:d["Customer"]||"",model:d["Model Name"]||"",item:d["Item Code"]||"",
        qty:d["Plan Qty"]||"",date:fDate(dt),ply:plyCount(d["Model Name"]),reels:0,sum:null})}
    if(jobs.length){var pps=jobs.map(function(j){return j.pp});
      try{ var s=await sb("rc_job_summary",{p_pps:pps})||{};
        jobs.forEach(function(j){j.sum=s[j.pp]||null; j.reels=j.sum?j.sum.reels:0}) }
      catch(e){ var c=await sb("rc_reel_counts",{p_pps:pps})||{}; jobs.forEach(function(j){j.reels=c[j.pp]||0}) }}
    return jobs},
  getEntries:function(pp){return sb("rc_list_entries",{p_pp:pp})},
  lookupReel:function(v){return sb("rc_lookup_reel",{p_value:v})},
  loadReel:function(e){return sb("rc_load_reel",{p:e})},
  finishReel:function(id,pp,b,op){return sb("rc_finish_reel",{p_id:id,p_pp:pp,p_balance:Number(b),p_operator:op})},
  deleteEntry:function(id,pp){return sb("rc_delete_entry",{p_id:id,p_pp:pp})},
  statusList:function(){return sb("rc_status_list",{p_days:2})},
  approveHold:function(ids,pin,mgr){return sb("rc_approve_hold",{p_ids:ids,p_pin:pin,p_manager:mgr})},
  undoApproval:function(ids){return sb("rc_undo_approval",{p_ids:ids})},
  searchReels:function(f){return sb("rc_search_reels",{p_gsm:f.gsm,p_bf:f.bf,p_size:f.size,p_shade:f.shade,
    p_wt_min:f.wmin===""?null:Number(f.wmin),p_wt_max:f.wmax===""?null:Number(f.wmax)})},
  report:function(fr,to,g){return sb("rc_erp_cons_report",{p_from:fr||null,p_to:to||null,p_group:g})}
};
function call(fn,args,cb){busy=true;
  Promise.resolve().then(function(){return API[fn].apply(null,args)})
  .then(function(x){busy=false;cb(x)})
  .catch(function(e){busy=false;toast(e&&e.message?e.message:String(e),"bad");draw()})}
function opName(){return $("op").value.trim()}
function saveOp(){try{localStorage.setItem("rc_op",$("op").value)}catch(e){}}
try{$("op").value=localStorage.getItem("rc_op")||""}catch(e){}

/* ---------- job list ---------- */
var jobsReq=0;
function loadJobs(){ var my=++jobsReq; $("jobs").innerHTML='<span class="mut">Loading...</span>'; $("jobsSum").textContent="";
  API.getJobs($("pDate").value).then(function(j){ if(my!==jobsReq)return; JOBS=j; renderJobs() })
    .catch(function(e){ if(my!==jobsReq)return; toast(e&&e.message?e.message:String(e),"bad") }) }
/* consumption status: Not started / Partial / Done (sab ply par reel + sabka weight bhara) */
function jobState(j){
  var s=j.sum; if(!s||!s.reels) return "none";
  return (s.plies>=j.ply && !s.loaded) ? "done" : "part";
}
function renderJobs(){
  var q=$("q").value.trim().toLowerCase();
  var list=JOBS.filter(function(j){return !q||(j.wo+" "+j.customer+" "+j.pp+" "+j.model).toLowerCase().indexOf(q)>=0});
  var cnt={done:0,part:0,none:0}, kgT=0;
  list.forEach(function(j){cnt[jobState(j)]++; kgT+=j.sum?Number(j.sum.kg)||0:0});
  $("jobsSum").innerHTML=list.length?((($("pDate").value)?'Planning '+esc(fDate(pDate($("pDate").value)))+': ':'Recent: ')+list.length+' jobs &middot; '+
    '<span class="pill ok">Done '+cnt.done+'</span> <span class="pill warn">Partial '+cnt.part+'</span> <span class="pill">Not started '+cnt.none+'</span> &middot; '+
    tn(kgT/1000)+' t'):'';
  if(!list.length){$("jobs").innerHTML='<span class="mut">No corrugation job found'+($("pDate").value?' for this planning date':'')+'.</span>';return}
  $("jobs").innerHTML=list.map(function(j){
    var st=jobState(j), s=j.sum||{};
    var badge=st==="done"?'<span class="pill ok">Done</span>':st==="part"?'<span class="pill warn">Partial</span>':'<span class="pill">Not started</span>';
    var info=s.reels?'<div class="mut">'+s.reels+' reel'+(s.reels>1?'s':'')+' &middot; '+tn((Number(s.kg)||0)/1000)+' t'+
      (s.inErp?' &middot; '+s.inErp+' in ERP':'')+(s.loaded?' &middot; '+s.loaded+' wt pending':'')+'</div>':
      (j.reels?'<div class="mut">'+j.reels+' reels</div>':'');
    return '<div class="job" data-pp="'+esc(j.pp)+'"><div><b>'+esc(j.wo)+'</b> &middot; '+esc(j.customer)+
      '<div class="mut">'+esc(j.model)+' &middot; '+esc(j.date)+'</div></div><div style="text-align:right">'+
      '<span class="pill">'+j.ply+' ply</span> '+badge+info+'</div></div>'}).join("");
  [].forEach.call(document.querySelectorAll(".job"),function(d){d.onclick=function(){openJob(d.getAttribute("data-pp"))}});
}

/* ---------- job ---------- */
function openJob(pp){
  job=JOBS.filter(function(j){return j.pp===pp})[0]; if(!job)return;
  if(!opName()){toast("First enter your name at the top","bad");$("op").focus();return}
  $("jSub").textContent=job.customer+" | "+job.model+" | Qty "+job.qty;
  $("listView").style.display="none"; $("jobView").style.display="block";
  ENTRIES=[]; found=null; activePly=0; $("slots").innerHTML='<div class="card mut">Loading...</div>';
  call("getEntries",[job.pp],function(list){ENTRIES=list; autoStep(); draw()});
}
function back(){ job=null; $("jobView").style.display="none"; $("listView").style.display="block"; loadJobs() }
function showTab(t){
  $("navJobs").className=t==="jobs"?"on":"sec"; $("navStatus").className=t==="status"?"on":"sec";
  $("navReport").className=t==="report"?"on":"sec";
  $("statusView").style.display=t==="status"?"block":"none";
  $("reportView").style.display=t==="report"?"block":"none";
  $("listView").style.display=(t==="jobs"&&!job)?"block":"none";
  $("jobView").style.display=(t==="jobs"&&job)?"block":"none";
  if(t==="status") loadStatus();
  if(t==="report" && !$("rpFrom").value) rpPreset("7");
}

/* ---------- Report tab (date-wise / month-wise consumption) ---------- */
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function rpPreset(p){
  var t=new Date(), f=new Date();
  if(p==="7") f.setDate(t.getDate()-6);
  if(p==="month") f=new Date(t.getFullYear(),t.getMonth(),1);
  if(p==="year") f=new Date(t.getFullYear(),3,1) > t ? new Date(t.getFullYear()-1,3,1) : new Date(t.getFullYear(),3,1);
  $("rpFrom").value=ymd(f); $("rpTo").value=ymd(t);
  $("rpGroup").value=(p==="year")?"month":"day";
  loadReport();
}
function kg(v){return (Number(v)||0).toLocaleString("en-IN",{maximumFractionDigits:1})}
function tn(v){return (Number(v)||0).toLocaleString("en-IN",{minimumFractionDigits:3,maximumFractionDigits:3})}
function mt(v){return (Number(v)||0).toLocaleString("en-IN",{maximumFractionDigits:0})}
function loadReport(){
  if(busy)return; $("rpBody").innerHTML='<div class="card mut">Loading...</div>';
  call("report",[$("rpFrom").value,$("rpTo").value,$("rpGroup").value],function(r){
    var T=r.total||{};
    var h='<div class="card"><div class="mut">ERP Reel Consumption report &middot; '+esc(r.from)+' to '+esc(r.to)+'</div>'+
      '<div style="font-size:26px;font-weight:800;margin:4px 0">'+tn(T.tons)+' t <span class="mut" style="font-size:16px">('+kg(T.kg)+' kg)</span></div>'+
      '<div class="mut">'+mt(T.meters)+' running meters &middot; '+(T.days||0)+' days &middot; '+(T.grades||0)+' paper grades'+
      (r.syncedAt?' &middot; ERP synced '+esc(r.syncedAt):' &middot; not synced yet')+'</div></div>';
    h+='<div class="card"><b>'+(r.group==="month"?"Month-wise":"Date-wise")+' (ERP)</b><table class="rep"><tr><th>'+(r.group==="month"?"Month":"Date")+
       '</th><th>Tonnes</th><th>Meters</th></tr>'+
       (r.rows||[]).map(function(x){return '<tr><td>'+esc(x.period)+'</td><td><b>'+tn(x.tons)+'</b></td><td>'+mt(x.meters)+'</td></tr>'}).join("")+
       ((r.rows||[]).length?'':'<tr><td colspan="3" class="mut">No consumption in this period (or not synced from ERP yet).</td></tr>')+'</table></div>';
    var J=r.jobTotal||{}, jd=r.byJobDay||[];
    h+='<div class="card"><b>Job-wise '+(r.group==="month"?"monthly":"daily")+'</b> <span class="mut">('+(r.jobSource?'ERP reel-wise':'app entries')+' &middot; '+(J.jobs||0)+' jobs &middot; '+tn(J.tons)+' t &middot; '+mt(J.meters)+' m)</span>';
    if(jd.length){ var last=null;
      h+='<table class="rep"><tr><th>WO</th><th>Reels</th><th>Tonnes</th><th>Meters</th></tr>'+
        jd.map(function(x){var s=''; if(x.period!==last){last=x.period; s='<tr><td colspan="4" style="text-align:left;color:var(--acc);font-weight:700;padding-top:12px">'+esc(x.period)+'</td></tr>'}
          return s+'<tr><td>'+esc(x.wo)+'<div class="mut">'+esc(x.customer||"")+'</div></td><td>'+x.reels+'</td><td><b>'+tn(x.tons)+'</b></td><td>'+mt(x.meters)+'</td></tr>'}).join("")+'</table>';
    } else h+='<div class="mut" style="margin-top:6px">No job entries in this period.</div>';
    h+='</div>';
    if((r.byGsmBf||[]).length) h+='<div class="card"><b>By GSM / BF (ERP)</b><table class="rep"><tr><th>GSM / BF</th><th>Tonnes</th><th>Meters</th></tr>'+
       r.byGsmBf.map(function(x){return '<tr><td>'+esc(x.gsm)+' GSM / '+esc(x.bf)+' BF</td><td>'+tn(x.tons)+'</td><td>'+mt(x.meters)+'</td></tr>'}).join("")+'</table></div>';
    if((r.byGrade||[]).length) h+='<div class="card"><b>By paper grade (ERP, top '+r.byGrade.length+')</b><table class="rep"><tr><th>Grade</th><th>kg</th><th>Meters</th></tr>'+
       r.byGrade.map(function(x){return '<tr><td>'+esc(x.gsm)+' GSM / '+esc(x.bf)+' BF / '+esc(x.size)+' cm<div class="mut">'+esc(x.shade)+' &middot; '+esc(x.rm)+'</div></td><td>'+kg(x.kg)+'</td><td>'+mt(x.meters)+'</td></tr>'}).join("")+'</table></div>';
    h+='<div class="mut" style="margin:0 4px 12px">Meters = kg &times; 1000 &divide; GSM &divide; width (m), width = size cm &divide; 100.</div>';
    $("rpBody").innerHTML=h;
  });
}

/* ---------- QR / barcode scanner (same library + parsing as Reel Stock app) ---------- */
var qrScanner=null, qrRunning=false;
function normalizeScannedCode(raw){
  var s=String(raw||"").trim(); if(!s) return {ok:false,message:"No code value was detected."};
  if(/^\d+(?:\.0+)?$/.test(s)) return {ok:true,value:String(parseInt(Number(s),10))};
  var c=s.replace(/reel\s*(no|number)?\s*[:#=\-]?\s*/ig," ").replace(/mill\s*(reel\s*)?(no|number)?\s*[:#=\-]?\s*/ig," ").trim();
  if(/^\d+(?:\.0+)?$/.test(c)) return {ok:true,value:String(parseInt(Number(c),10))};
  var nums=s.match(/\d{3,}/g)||[], u=nums.filter(function(v,i){return nums.indexOf(v)===i});
  if(u.length===1) return {ok:true,value:u[0]};
  return {ok:false,message:"Code has multiple / non-numeric values. Type the Reel / Mill No."};
}
async function openScanner(){
  $("scanner").classList.add("show"); $("scanNote").textContent="Point the camera at the reel QR / barcode.";
  if(typeof Html5Qrcode==="undefined"){ $("scanNote").textContent="Scanner could not load. Check internet and try again."; return }
  if(qrRunning) return;
  try{
    qrScanner=new Html5Qrcode("qrReader");
    var F=window.Html5QrcodeSupportedFormats||{};
    var cfg={fps:10,qrbox:{width:250,height:180},aspectRatio:1.333333,
      formatsToSupport:[F.QR_CODE,F.CODE_128,F.CODE_39,F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E].filter(function(x){return x!==undefined})};
    await qrScanner.start({facingMode:"environment"},cfg,onScan,function(){});
    qrRunning=true;
  }catch(err){ qrRunning=false; $("scanNote").textContent="Camera could not start. Allow camera permission and try again. "+(err&&err.message?err.message:err) }
}
async function closeScanner(){
  if(qrScanner&&qrRunning){ try{await qrScanner.stop()}catch(e){} try{qrScanner.clear()}catch(e){} }
  qrRunning=false; qrScanner=null; $("scanner").classList.remove("show");
}
async function onScan(text){
  var p=normalizeScannedCode(text);
  if(!p.ok){ $("scanNote").textContent=p.message; return }
  await closeScanner();
  var i=$("reelIn"); if(!i){ toast("Scanned "+p.value+" — open a ply (Load reel) first","bad"); return }
  i.value=p.value; toast("Scanned: "+p.value,"ok"); findReel();
}

/* ---------- search by spec (GSM / BF / Size / Shade / Weight) ---------- */
var specOpen=false, specF={gsm:"",bf:"",size:"",shade:"",wmin:"",wmax:""}, specRes=null;
function specToggle(){ specOpen=!specOpen; specRes=null; draw() }
function specRead(){ ["gsm","bf","size","shade","wmin","wmax"].forEach(function(k){var e=$("sp_"+k); if(e) specF[k]=e.value.trim()}) }
function specSearch(){
  specRead(); if(busy)return;
  call("searchReels",[specF],function(r){ specRes=r.ok?r:{err:r.msg}; draw() });
}
function specPick(reelNo){ specOpen=false; specRes=null; var i=$("reelIn"); draw(); i=$("reelIn"); if(i){i.value=reelNo; findReel()} }
function specPanel(){
  if(!specOpen) return '';
  var inp=function(k,ph,mode){return '<input id="sp_'+k+'" placeholder="'+ph+'" inputmode="'+(mode||"text")+'" value="'+esc(specF[k])+'" onkeydown="if(event.key===\'Enter\')specSearch()">'};
  var h='<div class="find"><div class="grid">'+inp("gsm","GSM","numeric")+inp("bf","BF","numeric")+inp("size","Size cm","decimal")+
        inp("shade","Shade")+inp("wmin","Wt min kg","decimal")+inp("wmax","Wt max kg","decimal")+'</div>'+
        '<div class="row" style="margin-top:8px"><button style="flex:1" onclick="specSearch()">Search reels</button>'+
        '<button class="sec" onclick="specToggle()">Close</button></div>';
  if(specRes&&specRes.err) h+='<div class="mut" style="margin-top:8px;color:#ffb3ad">'+esc(specRes.err)+'</div>';
  if(specRes&&specRes.reels){
    h+='<div class="mut" style="margin-top:8px">'+specRes.total+' reel(s) found'+(specRes.total>specRes.reels.length?' (showing '+specRes.reels.length+', lowest weight first)':'')+' &mdash; tap to select</div>';
    h+=specRes.reels.map(function(x){return '<div class="srow" onclick="specPick(\''+esc(x.reelNo)+'\')"><b>'+esc(x.reelNo)+'</b> <span class="mut">mill '+esc(x.millNo)+'</span>'+
      (x.qcHold?' <span class="pill warn">QC Hold (ERP)</span>':'')+'<br><span class="mut">'+esc(x.gsm)+' GSM &middot; '+esc(x.bf)+' BF &middot; '+esc(x.size)+' cm &middot; '+esc(x.shade)+' &middot; </span><b>'+kg(x.wt)+' kg</b></div>'}).join("");
  }
  return h+'</div>';
}

/* ---------- Status tab ---------- */
var STATUS=[];
var ST_GROUPS=[
  {key:"hold",  title:"QC Hold in ERP — approver: tap QC OK", cls:"warn"},
  {key:"qcpass",title:"QC OK given — still Hold in ERP (QC pass in CPMS pending)", cls:"warn"},
  {key:"qcload",title:"QC Hold reels loaded — balance weight not entered", cls:"warn"},
  {key:"wait",  title:"Production entry pending in ERP (will go to ERP automatically after entry)", cls:"warn"},
  {key:"chain", title:"Waiting for previous job (same reel) — goes to ERP automatically after that job", cls:"warn"},
  {key:"ready", title:"Ready for ERP (next auto run)", cls:""},
  {key:"loaded",title:"Loaded — balance weight not entered", cls:""},
  {key:"check", title:"Check ERP — needs a person to look", cls:"bad"},
  {key:"done",  title:"Posted to ERP (last 2 days)", cls:"ok"}];
function stGroup(e){
  if(e.status==="QC Hold")return e.qcErpHold===false?"ready":"hold";      // ERP me pass ho gayi -> agle run me ERP
  if(e.status==="Pending"&&e.qcHold&&e.qcApprovedBy&&e.qcErpHold!==false)return "qcpass";
  if(e.status==="Loaded"&&e.qcHold&&e.qcErpHold!==false)return "qcload";
  if(e.status==="Pending"&&/^Waiting for/.test(e.note||""))return "chain";
  if(e.status==="Pending")return /^WAIT/.test(e.note||"")?"wait":"ready";
  if(e.status==="Loaded")return "loaded";
  if(e.status==="Submitted")return "done";
  return "check";
}
function loadStatus(){ $("stBody").innerHTML='<div class="card mut">Loading...</div>';
  call("statusList",[],function(list){STATUS=list||[];renderStatus()}) }
function renderStatus(){
  var by={};STATUS.forEach(function(e){var g=stGroup(e);(by[g]=by[g]||[]).push(e)});
  var html="";
  ST_GROUPS.forEach(function(G){var rows=by[G.key]; if(!rows||!rows.length)return;
    var jobs={};rows.forEach(function(e){(jobs[e.pp]=jobs[e.pp]||[]).push(e)});
    html+='<div class="card"><h3 style="margin:0 0 8px"><span class="pill '+G.cls+'">'+rows.length+'</span> '+esc(G.title)+'</h3>';
    Object.keys(jobs).forEach(function(pp){var js=jobs[pp];
      html+='<div class="reel"><b>'+esc(js[0].wo)+'</b> <span class="mut">'+esc(js[0].customer||"")+'</span>';
      js.forEach(function(e){
        html+='<div class="mut" style="margin-top:4px">Ply '+e.plyNo+' '+esc(e.plyName)+' &middot; Reel <b>'+esc(e.reelNo)+'</b>'+
          qcTag(e)+' &middot; '+
          (e.consumedWt!=null?'Consumed <b>'+e.consumedWt+' kg</b> (bal '+e.balanceWt+')':'Loaded '+e.currentWt+' kg')+
          ' &middot; '+esc(e.operator||"")+(e.pushedAt?' &middot; ERP '+esc(e.pushedAt):'')+
          (e.qcApprovedBy?' &middot; approved by '+esc(e.qcApprovedBy):'')+
          (G.key==="check"&&e.note?'<br><span style="color:#ffb3ad">'+esc(String(e.note).split(/\s*(Message:|Stacktrace)/)[0].slice(0,180))+'</span>':'')+
          (G.key==="chain"&&e.note?'<br><span style="color:#ffd58a">'+esc(e.note)+'</span>':'')+
          (G.key==="hold"?' <button style="padding:6px 12px;margin-left:6px" onclick="approveReel(\''+esc(pp)+'\',\''+esc(e.id)+'\')">QC OK</button>':'')+'</div>'});
      if(G.key==="hold") html+='<div class="row" style="margin-top:8px;flex-wrap:wrap">'+
        '<input id="mgr_'+esc(pp)+'" placeholder="Approver name" style="flex:1;min-width:120px">'+
        '<input id="pin_'+esc(pp)+'" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="width:90px">'+
        '<button class="sec" onclick="approveJob(\''+esc(pp)+'\')">QC OK all</button></div>'+
        '<div class="mut" style="margin-top:4px">Enter approver name + PIN, then tap QC OK on a reel. QC is passed in CPMS, then consumption goes to ERP.</div>';
      if((G.key==="qcpass"||G.key==="ready"||G.key==="wait") && js.some(function(e){return e.qcHold&&e.qcApprovedBy&&e.qcApprovedBy!=="ERP QC"}))
        html+='<div class="row" style="margin-top:8px"><span class="mut" style="flex:1">QC reel sent to ERP by mistake?</span>'+
          '<button class="sec" onclick="undoJob(\''+esc(pp)+'\')">Undo (back to QC Hold)</button></div>';
      html+='</div>'});
    html+='</div>'});
  $("stBody").innerHTML=html||'<div class="card mut">Nothing pending.</div>';
  try{var m=localStorage.getItem("rc_mgr")||"";[].forEach.call(document.querySelectorAll('[id^="mgr_"]'),function(i){i.value=m})}catch(e){}
}
function undoJob(pp){
  if(busy)return;
  var ids=STATUS.filter(function(e){return e.pp===pp&&e.status==="Pending"&&e.qcHold&&e.qcApprovedBy&&e.qcApprovedBy!=="ERP QC"}).map(function(e){return e.id});
  if(!ids.length||!confirm("Move "+ids.length+" QC reel(s) back to QC Hold?"))return;
  call("undoApproval",[ids],function(r){ toast((r&&r.msg)||"Done",(r&&r.ok)?"ok":"bad"); loadStatus() });
}
function approveReel(pp,id){ approveJob(pp,[id]) }
function approveJob(pp,only){
  if(busy)return;
  var mgr=$("mgr_"+pp).value.trim(), pin=$("pin_"+pp).value.trim();
  if(!mgr){toast("Enter approver name","bad");$("mgr_"+pp).focus();return}
  if(!pin){toast("Enter your PIN","bad");$("pin_"+pp).focus();return}
  try{localStorage.setItem("rc_mgr",mgr)}catch(e){}
  var ids=only||STATUS.filter(function(e){return e.pp===pp&&e.status==="QC Hold"}).map(function(e){return e.id});
  call("approveHold",[ids,pin,mgr],function(r){
    if(r&&r.ok){toast(r.msg,"ok");loadStatus()} else {toast((r&&r.msg)||"Failed","bad");var p=$("pin_"+pp);if(p)p.value=""}});
}
function setPly(n){ job.ply=n; activePly=0; draw() }
function setStep(n){ step=n; found=null; activePly=0; draw() }
function reelsOf(p){return ENTRIES.filter(function(e){return +e.plyNo===p})}
function autoStep(){
  var allLoaded=true; for(var p=1;p<=job.ply;p++) if(!reelsOf(p).length) allLoaded=false;
  step = allLoaded ? 2 : 1;
}
function nextEmptyPly(){ for(var p=1;p<=job.ply;p++) if(!reelsOf(p).length) return p; return 0 }

function draw(){
  if(!job)return;
  $("jTitle").textContent=job.wo+"  —  "+job.ply+" ply";
  $("tab1").className=step===1?"on":"sec"; $("tab2").className=step===2?"on":"sec";
  var names=PLY_NAMES[job.ply];
  var html="";
  if(step===1 && !activePly) html+= nextEmptyPly()
     ? '<div class="card mut">Tap <b>Load reel</b> on any ply (any order).</div>'
     : '<div class="card"><span class="pill ok">Reels loaded on all plies</span> '+
       'After a reel is used, tap <b>2. Enter weight</b>. If a reel was changed midway, tap "+ Another reel" on that ply.</div>';
  for(var p=1;p<=job.ply;p++){
    var rs=reelsOf(p), act=(step===1 && p===activePly);
    html+='<div class="slot'+(act?' active':'')+'"><h3><span><span class="num">'+p+'</span>'+names[p-1]+'</span>'+
      (step===1 && !act?'<button class="'+(rs.length?'sec':'')+'" onclick="pickPly('+p+')">'+(rs.length?'+ Another reel':'Load reel')+'</button>':'')+
      (act?'<button class="sec" onclick="pickPly(0)">Close</button>':'')+'</h3>';
    if(!rs.length && !act) html+='<div class="mut">No reel yet</div>';
    rs.forEach(function(e){ html+=reelCard(e) });
    if(act) html+=finder();
    html+='</div>';
  }
  $("slots").innerHTML=html;
  if(step===1 && activePly && !found){var i=$("reelIn"); if(i) i.focus()}
}
/* QC reel tag: ERP me abhi bhi Hold (qcErpHold) ya pass ho chuki */
function qcTag(e){
  if(!e.qcHold) return '';
  return e.qcErpHold===false ? ' <span class="pill ok">QC Passed</span>' : ' <span class="pill warn">QC Hold (ERP)</span>';
}
function reelCard(e){
  var spec=esc(e.gsm)+' GSM / '+esc(e.bf)+' BF / '+esc(e.size)+' / '+esc(e.shade);
  var head='<div class="row" style="justify-content:space-between"><div><b>Reel '+esc(e.reelNo)+'</b> <span class="mut">mill '+esc(e.millNo)+'</span>'+
    qcTag(e)+'<br>'+
    '<span class="mut">'+spec+' &middot; at loading '+e.currentWt+' kg</span></div>';
  if(e.erpStatus==="Submitted") return '<div class="reel">'+head+'<span class="pill ok">In ERP</span></div>'+
     '<div class="mut">Balance '+e.balanceWt+' kg &middot; Consumed '+e.consumedWt+' kg</div></div>';
  var del='<button class="del" onclick="delEntry(\''+esc(e.id)+'\')" title="Remove">&#10005;</button>';
  if(e.erpStatus==="Loaded"){
    if(step===1) return '<div class="reel">'+head+'<span class="pill warn">Loaded</span>'+del+'</div></div>';
    return '<div class="reel">'+head+del+'</div>'+
      '<div class="row" style="margin-top:8px"><input id="bal_'+esc(e.id)+'" inputmode="decimal" placeholder="Balance reel wt kg (0 if fully used)" '+
      'onkeydown="if(event.key===\'Enter\')finish(\''+esc(e.id)+'\')">'+
      '<button onclick="finish(\''+esc(e.id)+'\')">Save</button></div>'+
      '<button class="sec" style="width:100%;margin-top:8px" onclick="fullConsume(\''+esc(e.id)+'\')">Full Consume (balance 0)</button></div>';
  }
  var wait=/^WAIT/.test(e.erpNote||""), chainW=(e.erpNote||"").match(/^Waiting for (\S+)/);
  var st=e.erpStatus==="QC Hold"?'<span class="pill warn">Waiting for approver QC OK</span>'
        :e.erpStatus==="Pending"?(chainW?'<span class="pill warn">Waiting for '+esc(chainW[1])+'</span>'
              :wait?'<span class="pill warn">Production entry pending</span>':'<span class="pill">Ready for ERP</span>')
        :'<span class="pill bad" title="'+esc(e.erpNote)+'">'+esc(e.erpStatus)+'</span>';
  return '<div class="reel">'+head+st+del+'</div><div class="mut">Balance '+e.balanceWt+' kg &middot; <b>Consumed '+e.consumedWt+' kg</b>'+
    (e.qcApprovedBy?' &middot; approved by '+esc(e.qcApprovedBy):'')+
    (e.erpNote&&!wait?' &middot; '+esc(e.erpNote):'')+'</div></div>';
}
function finder(){
  var h='<div class="row" style="margin-top:8px"><input id="reelIn" inputmode="numeric" placeholder="Reel No or Mill No" '+
        'onkeydown="if(event.key===\'Enter\')findReel()"><button onclick="findReel()">Search</button>'+
        '<button class="sec" title="Scan QR / barcode" onclick="openScanner()">&#128247; Scan</button></div>'+
        (specOpen?'':'<div style="margin-top:6px"><button class="sec" style="width:100%" onclick="specToggle()">Search by GSM / BF / Size / Shade / Weight</button></div>')+
        specPanel();
  if(found && found.multi){
    h+='<div class="find">More than one reel found, choose the correct one:'+found.multi.map(function(x,i){
      return '<div style="margin-top:6px"><button class="sec" onclick="chooseReel('+i+')">'+esc(x.reelNo)+' / mill '+esc(x.millNo)+
        ' &middot; '+esc(x.gsm)+' GSM &middot; '+esc(x.size)+'</button></div>'}).join("")+'</div>';
  } else if(found && found.reel){
    var x=found.reel;
    h+='<div class="find"><b>Reel '+esc(x.reelNo)+'</b> &middot; mill '+esc(x.millNo)+'<br>'+
      esc(x.gsm)+' GSM &middot; '+esc(x.bf)+' BF &middot; '+esc(x.size)+' cm &middot; '+esc(x.shade)+'<br>'+
      'Weight: <b>'+x.currentWt+' kg</b>'+(x.usedNote?' <span class="pill warn">'+esc(x.usedNote)+'</span>':'')+
      (x.qcHold?'<br><span class="pill warn">QC Hold (ERP)</span> <span class="mut">Goes to ERP only after approver QC OK (PIN) in Status tab.</span>':'')+
      (x.qcPassed?'<br><span class="pill ok">QC Passed</span> <span class="mut">QC passed in ERP.</span>':'')+
      '<div class="row" style="margin-top:10px"><button onclick="loadIt()">Load on ply '+activePly+'</button>'+
      '<button class="sec" onclick="found=null;draw()">Cancel</button></div></div>';
  } else if(found && found.err){
    h+='<div class="find"><span class="pill bad">Not found</span> '+esc(found.err)+'</div>';
  }
  return h;
}
function pickPly(p){ activePly=p; found=null; draw() }
function findReel(){
  var v=$("reelIn").value.trim(); if(!v||busy)return;
  call("lookupReel",[v],function(r){
    if(!r.ok) found={err:r.msg}; else if(r.reels.length>1) found={multi:r.reels}; else found={reel:r.reels[0]};
    draw(); if(found.err){var i=$("reelIn"); if(i){i.value=v;i.select()}}
  });
}
function chooseReel(i){ found={reel:found.multi[i]}; draw() }
function loadIt(){
  if(busy||!found||!found.reel)return;
  call("loadReel",[{wo:job.wo,pp:job.pp,customer:job.customer,item:job.item,date:job.date,
     plyCount:job.ply,plyNo:activePly,reelNo:found.reel.reelNo,operator:opName()}],
    function(list){ ENTRIES=list; toast("Reel loaded on ply "+activePly,"ok"); found=null; activePly=0; autoStep(); draw() });
}
function finish(id){
  var v=$("bal_"+id).value.trim();
  if(v===""){toast("Enter balance reel weight (0 if fully used)","bad");return}
  if(busy)return;
  call("finishReel",[id,job.pp,v,opName()],function(list){ ENTRIES=list; toast("Weight saved","ok"); draw() });
}
function fullConsume(id){
  if(busy)return;
  var e=ENTRIES.filter(function(x){return x.id===id})[0]; if(!e)return;
  if(!confirm("Reel "+e.reelNo+" fully consumed?\nBalance weight will be saved as 0 kg (consumed "+e.currentWt+" kg)."))return;
  call("finishReel",[id,job.pp,0,opName()],function(list){ ENTRIES=list; toast("Reel "+e.reelNo+": full consume saved (balance 0)","ok"); draw() });
}
function delEntry(id){ if(busy||!confirm("Remove this reel?"))return;
  call("deleteEntry",[id,job.pp],function(list){ ENTRIES=list; draw() }) }

window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();installEvt=e;$("installBtn").style.display="inline-block"});

function installApp(){ if(!installEvt)return; installEvt.prompt();
  installEvt.userChoice.finally(function(){installEvt=null;$("installBtn").style.display="none"}) }
