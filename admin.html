<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Starish SQL Admin</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2632;--mute:#66727f;--line:#dfe4ea;--head:#7f1d1d;--acc:#b91c1c;--chip:#eef2f6;
--ok:#166534;--okb:#dcfce7;--bad:#991b1b;--badb:#fee2e2;--warn:#92400e;--warnb:#fef3c7;--th:#f1f5f9;--blue:#1d4ed8;--blueb:#dbeafe}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--card:#18202a;--ink:#e6edf3;--mute:#9aa7b4;--line:#2b3644;--chip:#222c38;
--okb:#14351f;--ok:#86efac;--badb:#3b1515;--bad:#fca5a5;--warnb:#3a2a0d;--warn:#fcd34d;--th:#1f2934;--blueb:#172554;--blue:#93c5fd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,Arial}
header{background:var(--head);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 auto 4px 0}
header label{font-size:12px;display:flex;flex-direction:column;gap:2px}
header input{font:inherit;padding:4px 6px;border-radius:6px;border:0}
.btn{font:inherit;border:0;border-radius:7px;padding:7px 13px;cursor:pointer;background:var(--acc);color:#fff;white-space:nowrap}
.btn.l{background:#ffffff22;border:1px solid #ffffff66}
.btn.g{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;max-width:1500px;margin:0 auto}
nav button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px 8px 0 0;padding:8px 13px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--head);color:#fff;border-color:var(--head)}
nav button.on .tag{background:#ffffff33;color:#fff}
main{max-width:1500px;margin:0 auto;padding:0 16px 50px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tools input,.tools select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.tools input[type=search]{flex:1;min-width:180px}
.note{color:var(--mute);font-size:12.5px;margin:2px 0 10px}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.8px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
th{background:var(--th);cursor:pointer;user-select:none}
thead{position:sticky;top:0;z-index:2}
tr.fr th{padding:3px 4px;cursor:default}
tr.fr input{width:100%;min-width:60px;font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
tr.fr input.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
tr:hover td{background:#b91c1c10}
tr.gone td{opacity:.55}
.tag{padding:1px 7px;border-radius:99px;font-size:11.5px;background:var(--chip)}
.t-ok{background:var(--okb);color:var(--ok)}.t-bad{background:var(--badb);color:var(--bad)}.t-warn{background:var(--warnb);color:var(--warn)}.t-blue{background:var(--blueb);color:var(--blue)}
.del{font:inherit;font-size:11.5px;padding:2px 9px;border-radius:6px;border:1px solid var(--bad);background:var(--badb);color:var(--bad);cursor:pointer}
.del.off{border-color:var(--line);background:var(--chip);color:var(--mute)}
.res{font:inherit;font-size:11.5px;padding:2px 9px;border-radius:6px;border:1px solid var(--ok);background:var(--okb);color:var(--ok);cursor:pointer}
.lnk{color:var(--blue);cursor:pointer;text-decoration:underline}
#login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
#login h2{margin:0 0 4px;font-size:18px}
#login input{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px;background:var(--card);color:var(--ink)}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:30;max-width:92vw}
#msg.err{background:#991b1b}
#mdlg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#mdlg .box{background:var(--card);color:var(--ink);border-radius:12px;padding:18px;max-width:460px;width:100%;border:1px solid var(--line)}
#mdlg h3{margin:0 0 8px;font-size:16px}
#mdlg .sum{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;white-space:pre-wrap}
#mdlg input{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px;background:var(--card);color:var(--ink)}
#mdlg label{font-size:12.5px;color:var(--mute)}
.row{display:flex;gap:8px;justify-content:flex-end}
.loading{padding:40px;text-align:center;color:var(--mute)}
@media (max-width:640px){header h1{width:100%}}
</style>
</head>
<body>
<div id="login">
  <h2>Starish SQL Admin</h2>
  <div class="note">View all SQL entries. Delete wrong / extra entries (they go to Trash and can be restored).</div>
  <label class="note">Your name</label>
  <input id="lname" autocomplete="name" placeholder="e.g. Mukesh">
  <label class="note">Admin PIN</label>
  <input id="lpin" type="password" autocomplete="current-password" placeholder="Admin PIN">
  <button class="btn" id="lbtn" style="width:100%">Open</button>
</div>

<div id="app" style="display:none">
<header>
  <h1>Starish SQL Admin</h1>
  <label>From<input type="date" id="dfrom"></label>
  <label>To<input type="date" id="dto"></label>
  <button class="btn l" id="bref">⟳ Refresh</button>
  <button class="btn l" id="bout">Lock</button>
</header>
<nav id="tabs"></nav>
<main><div class="panel" id="panel"><div class="loading">Loading…</div></div></main>
</div>

<div id="mdlg"><div class="box">
  <h3 id="mtitle">Delete entry</h3>
  <div class="sum" id="msum"></div>
  <div id="mreasonw"><label>Reason (required)</label><input id="mreason" maxlength="200" placeholder="e.g. operator made double entry"></div>
  <div class="row"><button class="btn g" id="mno">Cancel</button><button class="btn" id="myes">Move to Trash</button></div>
</div></div>
<div id="msg"></div>

<script>
const SB_URL='https://axgyeppfrcmhwrpxztvv.supabase.co';
const SB_KEY='sb_publishable_fVX7S1YB3Zank8FTUmlpXg_v0nkwLCT';   // publishable key only — never the secret key
let PIN='',NAME='',CUR='entries',DATA={},CF={},SORT={},TBL=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t,err){const m=$('msg');m.textContent=t;m.className=err?'err':'';m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',err?7000:4000)}
async function rpc(fn,body){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),30000);
  try{const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',signal:ctl.signal,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
    if(!r.ok)throw Error((j&&(j.message||j.hint))||('Server error '+r.status));
    if(j&&j.error)throw Error(j.error);return j}
  catch(e){if(e.name==='AbortError')throw Error('Internet is slow — please try again.');if(e instanceof TypeError)throw Error('Could not connect to SQL. Check the internet.');throw e}
  finally{clearTimeout(t)}}
const iso=d=>d.toISOString().slice(0,10);
const fmtT=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?v:d.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const fmtD=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v||'');return m?`${m[3]}-${m[2]}-${m[1]}`:(v||'')};
function stTag(s){s=s||'';const c=s==='Submitted'?'t-ok':s==='Partial'?'t-blue':s==='Pending'||s===''?'t-warn':'t-bad';return `<span class="tag ${c}">${esc(s||'Not sent')}</span>`}
function bdText(v){if(Array.isArray(v))return v.map(x=>x&&typeof x==='object'?`${x.r||''} ${x.m||''}m`:x).join('; ');if(v&&typeof v==='object')return JSON.stringify(v);return v}

/* ---------- tabs ---------- */
const TABS=[
 {id:'entries',name:'Production Entries',dates:true},
 {id:'corr',name:'⚠ Corrugation Check',dates:true},
 {id:'BOARDLINE',name:'Boardline Reports',dates:true},
 {id:'PRODUCTION',name:'Production Reports',dates:true},
 {id:'machines',name:'Machines'},
 {id:'trash',name:'🗑 Trash'},
 {id:'audit',name:'Audit Log'},
 {id:'tables',name:'All Tables'}];
function drawTabs(){$('tabs').innerHTML=TABS.map(t=>`<button class="${t.id===CUR?'on':''}" data-t="${t.id}">${esc(t.name)}${DATA[t.id]?` <span class="tag">${DATA[t.id].rows.length}</span>`:''}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{CUR=b.dataset.t;TBL=null;drawTabs();load()})}

/* ---------- loading ---------- */
async function load(force){
  const tab=TABS.find(t=>t.id===CUR);if(force)delete DATA[CUR];
  if(DATA[CUR]&&!force){render();return}
  $('panel').innerHTML='<div class="loading">Loading…</div>';
  const f=$('dfrom').value,t=$('dto').value;
  try{let rows;
    if(CUR==='entries')rows=(await rpc('pv3_adm_entries',{p_pin:PIN,p_from:f,p_to:t})).rows;
    else if(CUR==='BOARDLINE'||CUR==='PRODUCTION')rows=(await rpc('pv3_adm_reports',{p_pin:PIN,p_kind:CUR,p_from:f,p_to:t})).rows;
    else if(CUR==='corr')rows=(await rpc('pv3_adm_corr_check',{p_pin:PIN,p_from:f,p_to:t})).rows;
    else if(CUR==='machines')rows=(await rpc('pv3_adm_machines',{p_pin:PIN})).rows;
    else if(CUR==='trash')rows=(await rpc('pv3_adm_trash',{p_pin:PIN})).rows;
    else if(CUR==='audit')rows=(await rpc('pv3_adm_audit',{p_pin:PIN})).rows;
    else if(CUR==='tables')rows=(await rpc('pv3_adm_tables',{p_pin:PIN})).rows;
    DATA[CUR]={rows:rows||[]};drawTabs();render()}
  catch(e){$('panel').innerHTML=`<div class="loading">❌ ${esc(e.message)}</div>`;if(/PIN|locked/i.test(e.message))lock(e.message)}}

/* ---------- table model per tab ---------- */
const ENTRY_COLS=['Production Date','WO No','JC No','Customer','Model Name','Process Name','Route Sequence','Machine Name','Start Time','End Time','Input Qty','Production Qty','Rej Qty','No of Pallets','ERP Status','Remarks','PP Code'];
function model(){
  const rows=(DATA[CUR]||{rows:[]}).rows;
  if(CUR==='entries'){
    return {cols:['',...ENTRY_COLS,'Updated'],rows:rows.map((r,i)=>{const d=r.data||{};const st=d['ERP Status']||'';const ok=!r.erp_closed&&(st===''||st==='Pending');
      return {i,cells:[ok?`<button class="del" data-i="${i}">Delete</button>`:`<button class="del off" data-i="${i}" title="Already in ERP">In ERP</button>`,
        ...ENTRY_COLS.map(c=>c==='ERP Status'?stTag(st):esc(d[c])),esc(fmtT(r.updated_at))],
        text:[ok?'delete':'in erp',...ENTRY_COLS.map(c=>c==='ERP Status'?(st||'Not sent'):String(d[c]??'')),fmtT(r.updated_at)]}})}
  }
  if(CUR==='BOARDLINE'||CUR==='PRODUCTION'){
    const keys=[];rows.forEach(r=>Object.keys(r.data||{}).forEach(k=>{if(!keys.includes(k)&&k!=='DATE')keys.push(k)}));
    const pref=['SHIFT','MACHINE_NAME','START_TIME','END_TIME'];keys.sort((a,b)=>(pref.indexOf(a)+1||99)-(pref.indexOf(b)+1||99));
    return {cols:['','Date',...keys,'Saved','Updated'],rows:rows.map((r,i)=>{const d=r.data||{};const vals=keys.map(k=>String(bdText(d[k])??''));
      return {i,cells:[`<button class="del" data-i="${i}">Delete</button>`,esc(fmtD(r.report_date)),...vals.map(esc),esc(fmtT(r.created_at)),esc(fmtT(r.updated_at))],
        text:['delete',fmtD(r.report_date),...vals,fmtT(r.created_at),fmtT(r.updated_at)]}})}
  }
  if(CUR==='corr'){const ks=['flags','date','start','end','shift','wo','jc','customer','qty','status'];
    return {cols:['Check','Prod Date','Start','End','Boardline shift','WO No','JC','Customer','Production','ERP Status'],rows:rows.map((r,i)=>{const v=ks.map(k=>String(r[k]??''));
      return {i,cells:[r.flags?`<span class="tag t-bad">${esc(r.flags)}</span>`:'<span class="tag t-ok">OK</span>',...v.slice(1).map((x,j)=>j===8?stTag(x):esc(x))],text:[r.flags||'OK',...v.slice(1)]}})}}
  if(CUR==='machines')return {cols:['','Machine','Added'],rows:rows.map((r,i)=>({i,cells:[`<button class="del" data-i="${i}">Delete</button>`,esc(r.name),esc(fmtT(r.created_at))],text:['delete',r.name,fmtT(r.created_at)]}))};
  if(CUR==='trash')return {cols:['','Deleted at','By','Reason','What','Details','Status'],rows:rows.map((r,i)=>{const s=trashSummary(r);const open=!r.restored_at;
      return {i,gone:!open,cells:[open?`<button class="res" data-i="${i}">Restore</button>`:'',esc(fmtT(r.at)),esc(r.by_name),esc(r.reason),esc(s.what),esc(s.det),
        open?'<span class="tag t-warn">In Trash</span>':`<span class="tag t-ok">Restored ${esc(fmtT(r.restored_at))} by ${esc(r.restored_by)}</span>`],
        text:[open?'restore':'',fmtT(r.at),r.by_name,r.reason,s.what,s.det,open?'In Trash':'Restored']}})};
  if(CUR==='audit'){const c=['at','by','action','reason','wo','process','old_qty','new_qty','old_status','new_status','row_id'];
    return {cols:['Time','By','Action','Reason','WO','Process','Old Qty','New Qty','Old Status','New Status','Row ID'],rows:rows.map((r,i)=>{const v=c.map(k=>k==='at'?fmtT(r.at):String(r[k]??''));return {i,cells:v.map(esc),text:v}})}}
  if(CUR==='tables'){
    if(TBL){const rs=TBL.rows;const keys=[];rs.forEach(r=>Object.keys(r).forEach(k=>{if(k==='data'&&r.data&&typeof r.data==='object'){Object.keys(r.data).forEach(dk=>{if(!keys.includes('data.'+dk))keys.push('data.'+dk)})}else if(!keys.includes(k))keys.push(k)}));
      const get=(r,k)=>{const v=k.startsWith('data.')?(r.data||{})[k.slice(5)]:r[k];return v&&typeof v==='object'?JSON.stringify(v):String(v??'')};
      return {cols:keys,rows:rs.map((r,i)=>{const v=keys.map(k=>get(r,k));return {i,cells:v.map(esc),text:v}})}}
    return {cols:['Table','Rows'],rows:rows.map((r,i)=>({i,cells:[`<span class="lnk" data-tb="${esc(r.name)}">${esc(r.name)}</span>`,esc(r.rows)],text:[r.name,String(r.rows)]}))}
  }
  return {cols:[],rows:[]}}
function trashSummary(r){const d=r.row_data||{};
  if(r.src_table==='production_planning_test'){const x=d.data||{};return {what:r.mode==='ROW'?'Extend lot':'Production entry',det:`WO ${x['WO No']||''} · ${x['Process Name']||''} · ${x['Production Date']||''} ${x['Start Time']||''}-${x['End Time']||''} · Qty ${x['Production Qty']||''}`}}
  if(r.src_table==='pv3_reports_test'){const x=d.data||{};return {what:(d.kind||'')+' report',det:`${fmtD(d.report_date)} · ${x.SHIFT||''} ${x.MACHINE_NAME||''} · ${x.START_TIME||''}-${x.END_TIME||''}`}}
  if(r.src_table==='pv3_machines_test')return {what:'Machine',det:d.name||''};
  return {what:r.src_table,det:r.src_key}}

/* ---------- render with filters ---------- */
function key(){return CUR+(TBL?':'+TBL.name:'')}
function render(){
  const m=model(),k=key(),f=CF[k]||{},q=(f.q||'').toLowerCase(),s=SORT[k];
  let rows=m.rows.filter(r=>(!q||r.text.join(' ').toLowerCase().includes(q))&&Object.entries(f).every(([c,v])=>c==='q'||!v||String(r.text[c]||'').toLowerCase().includes(v.toLowerCase())));
  if(s){rows=rows.slice().sort((a,b)=>{const x=a.text[s.c]||'',y=b.text[s.c]||'';const nx=parseFloat(x),ny=parseFloat(y);const r=(!isNaN(nx)&&!isNaN(ny)&&/^-?[\d.]+$/.test(x)&&/^-?[\d.]+$/.test(y))?nx-ny:x.localeCompare(y);return s.d*r})}
  const tab=TABS.find(t=>t.id===CUR);
  const notes={entries:'Only entries that are NOT in ERP yet (status "Not sent" / Pending) can be deleted. A deleted entry is cleared from its process, so the operator can enter it again. Extend lots are removed completely. Everything goes to Trash.',
    BOARDLINE:'Deleted report also gets removed from the Report Sheet (Report Portal) in the next copy (about 10 minutes).',
    PRODUCTION:'Deleted report also gets removed from the Report Sheet (Report Portal) in the next copy (about 10 minutes).',
    corr:'Every CORRUGATION entry of the dates, in time order. Check = OVERLAPS another job (corrugator runs one job at a time), OUTSIDE BOARDLINE SHIFT TIME, NO BOARDLINE REPORT, LONGER THAN 12 H or FUTURE. Fix the flagged ones before the reel consumption report (app Status → Fix, or ERP).',
    machines:'Delete a wrongly added machine name.',trash:'Restore puts the entry back exactly as it was.',audit:'Last 500 changes (manager fixes, admin deletes / restores, job hold).',
    tables:TBL?`Table ${TBL.name} — latest ${TBL.rows.length} rows (read only).`:'Every SQL table with its row count (read only). Click a table to see its rows.'};
  $('panel').innerHTML=`<div class="tools">${TBL?'<button class="btn g" id="tback">← All tables</button>':''}
     <input type="search" id="q" placeholder="Search in all columns…" value="${esc(f.q||'')}">
     <span class="note" style="margin:0">${rows.length} of ${m.rows.length}${tab.dates?` · ${fmtD($('dfrom').value)} to ${fmtD($('dto').value)}`:''}</span>
     <button class="btn g" id="cfc">✕ Clear filters</button></div>
   <div class="note">${esc(notes[CUR]||'')}</div>
   ${m.rows.length?`<div class="tw"><table><thead><tr>${m.cols.map((c,i)=>`<th data-c="${i}">${esc(c)}${s&&s.c===i?(s.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr>
   <tr class="fr">${m.cols.map((c,i)=>`<th>${c?`<input data-f="${i}" class="${f[i]?'on':''}" value="${esc(f[i]||'')}" placeholder="filter">`:''}</th>`).join('')}</tr></thead>
   <tbody>${rows.map(r=>`<tr class="${r.gone?'gone':''}">${r.cells.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="loading">No rows.</div>'}`;
  const qi=$('q');qi.oninput=()=>{(CF[k]=CF[k]||{}).q=qi.value;debounce(()=>{render();const n=$('q');n.focus();n.setSelectionRange(n.value.length,n.value.length)})};
  $('cfc').onclick=()=>{delete CF[k];render()};
  if($('tback'))$('tback').onclick=()=>{TBL=null;render()};
  $('panel').querySelectorAll('input[data-f]').forEach(inp=>inp.oninput=()=>{(CF[k]=CF[k]||{})[inp.dataset.f]=inp.value;const id=inp.dataset.f;debounce(()=>{render();const n=$('panel').querySelector(`input[data-f="${id}"]`);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}})});
  $('panel').querySelectorAll('th[data-c]').forEach(th=>th.onclick=()=>{const c=+th.dataset.c;SORT[k]=SORT[k]&&SORT[k].c===c?{c,d:-SORT[k].d}:{c,d:1};render()});
  $('panel').querySelectorAll('button.del').forEach(b=>b.onclick=()=>askDelete(+b.dataset.i,b.classList.contains('off')));
  $('panel').querySelectorAll('button.res').forEach(b=>b.onclick=()=>askRestore(+b.dataset.i));
  $('panel').querySelectorAll('[data-tb]').forEach(a=>a.onclick=()=>openTable(a.dataset.tb));
}
function debounce(fn){clearTimeout(debounce.t);debounce.t=setTimeout(fn,250)}
async function openTable(name){$('panel').innerHTML='<div class="loading">Loading…</div>';
  try{const j=await rpc('pv3_adm_table_rows',{p_pin:PIN,p_table:name,p_limit:500});TBL={name,rows:j.rows||[]};render()}catch(e){toast(e.message,1);render()}}

/* ---------- delete / restore ---------- */
let PEND=null;
function dialog(title,sum,yes,needReason,fn){$('mtitle').textContent=title;$('msum').textContent=sum;$('myes').textContent=yes;$('mreasonw').style.display=needReason?'':'none';$('mreason').value='';$('mdlg').style.display='flex';PEND=fn;if(needReason)setTimeout(()=>$('mreason').focus(),50)}
$('mno').onclick=()=>{$('mdlg').style.display='none';PEND=null};
$('myes').onclick=async()=>{if(!PEND)return;const reason=$('mreason').value.trim();
  if($('mreasonw').style.display!=='none'&&reason.length<3){toast('Please write a reason.',1);return}
  $('myes').disabled=true;try{const j=await PEND(reason);$('mdlg').style.display='none';toast(j.message||'Done');
    delete DATA.trash;delete DATA.audit;await load(true)}catch(e){toast(e.message,1)}finally{$('myes').disabled=false}};
function askDelete(i,blocked){const r=DATA[CUR].rows[i];
  if(CUR==='entries'){const d=r.data||{};const sum=`WO ${d['WO No']||''} · JC ${d['JC No']||''}\n${d['Process Name']||''} (step ${d['Route Sequence']||''})\nDate ${d['Production Date']||''}  ${d['Start Time']||''} – ${d['End Time']||''}\nQty ${d['Production Qty']||''}  Rej ${d['Rej Qty']||''}\nERP Status: ${d['ERP Status']||'Not sent'}`;
    if(blocked){toast(r.erp_closed?'This job is closed in ERP — cannot delete here.':`This entry is already in ERP (Status: ${d['ERP Status']}). Please correct it in ERP first.`,1);return}
    dialog('Delete production entry?',sum,'Move to Trash',true,reason=>rpc('pv3_adm_delete_entry',{p_pin:PIN,p_row_id:r.row_id,p_reason:reason,p_by:NAME}))}
  else if(CUR==='BOARDLINE'||CUR==='PRODUCTION'){const d=r.data||{};const sum=`${r.kind} report\nDate ${fmtD(r.report_date)} · ${d.SHIFT||''} ${d.MACHINE_NAME||''}\n${d.START_TIME||''} – ${d.END_TIME||''}\nQty ${d.PRODUCTION_QTY??''}`;
    dialog('Delete shift report?',sum,'Move to Trash',true,reason=>rpc('pv3_adm_delete_report',{p_pin:PIN,p_id:r.id,p_reason:reason,p_by:NAME}))}
  else if(CUR==='machines')dialog('Delete machine?',r.name,'Move to Trash',true,reason=>rpc('pv3_adm_delete_machine',{p_pin:PIN,p_name:r.name,p_reason:reason,p_by:NAME}))}
function askRestore(i){const r=DATA.trash.rows[i];const s=trashSummary(r);
  dialog('Restore from Trash?',`${s.what}\n${s.det}\nDeleted by ${r.by_name}: ${r.reason}`,'Restore',false,()=>rpc('pv3_adm_restore',{p_pin:PIN,p_trash_id:r.id,p_by:NAME}).then(j=>{['entries','BOARDLINE','PRODUCTION','machines'].forEach(t=>delete DATA[t]);return j}))}

/* ---------- login ---------- */
function lock(why){PIN='';DATA={};$('app').style.display='none';$('login').style.display='block';$('lpin').value='';if(why)toast(why,1)}
async function login(){const name=$('lname').value.trim(),pin=$('lpin').value;
  if(name.length<2){toast('Please write your name.',1);return}if(!pin){toast('Please enter the Admin PIN.',1);return}
  $('lbtn').disabled=true;try{await rpc('pv3_adm_login',{p_pin:pin});PIN=pin;NAME=name;try{localStorage.setItem('sqladm_name',name)}catch(e){}
    $('login').style.display='none';$('app').style.display='block';drawTabs();load(true)}
  catch(e){toast(e.message,1)}finally{$('lbtn').disabled=false}}
$('lbtn').onclick=login;$('lpin').onkeydown=e=>{if(e.key==='Enter')login()};
$('bout').onclick=()=>lock();
$('bref').onclick=()=>{TBL=null;load(true)};
['dfrom','dto'].forEach(id=>$(id).onchange=()=>{['entries','corr','BOARDLINE','PRODUCTION'].forEach(t=>delete DATA[t]);if(TABS.find(t=>t.id===CUR).dates)load(true);else drawTabs()});
(()=>{const t=new Date(),f=new Date(t);f.setDate(t.getDate()-7);$('dfrom').value=iso(f);$('dto').value=iso(t);
  try{$('lname').value=localStorage.getItem('sqladm_name')||''}catch(e){}
  let idle;const reset=()=>{clearTimeout(idle);idle=setTimeout(()=>{if(PIN)lock('Locked after 20 minutes of no use.')},20*60000)};['click','keydown'].forEach(ev=>document.addEventListener(ev,reset));reset()})();
</script>
